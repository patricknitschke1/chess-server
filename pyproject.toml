[project]
name = "chess-arena"
version = "0.1.0"
description = "Chess bot competition server for an agentic AI workshop"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chess_core*", "chess_server*"]

[tool.pytest.ini_options]
testpaths = ["tests", "starter-kit/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--strict-markers"
asyncio_mode = "auto"
